apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlb-live-sync
spec:
  schedule: "0 8 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: mlb-live-sync
              image: "{{ registry_name }}/mlb:{{ env }}"
              imagePullPolicy: Always
              command: ["bundle", "exec", "rails", "runner", "MlbSyncTeamsJob.perform_later(Time.current.year)"]
              env:
                - name: RAILS_ENV
                  value: "production"
                - name: RAILS_LOG_TO_STDOUT
                  value: "true"
                - name: SECRET_KEY_BASE
                  valueFrom:
                    secretKeyRef:
                      name: rails-secrets
                      key: secret_key_base
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: database-url
                      key: MLB_DATABASE_URL
                - name: REDIS_URL_SIDEKIQ
                  valueFrom:
                    secretKeyRef:
                      name: cache-url
                      key: MLB_REDIS_URL
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: registry-sports
