apiVersion: apps/v1
kind: Deployment
metadata:
  name: nba-sidekiq
  labels:
    app: nba-sidekiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nba-sidekiq
  template:
    metadata:
      labels:
        app: nba-sidekiq
    spec:
      containers:
        - name: nba-sidekiq
          image: "{{ registry_name }}/nba:{{ env }}"
          imagePullPolicy: Always
          command: ["bundle", "exec", "sidekiq"]
          resources:
            requests:
              cpu: "150m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          env:
            - name: RAILS_ENV
              value: "production"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: rails-secrets
                  key: secret_key_base
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: NBA_DATABASE_URL
            - name: REDIS_URL_SIDEKIQ
              valueFrom:
                secretKeyRef:
                  name: cache-url
                  key: NBA_REDIS_URL
            - name: SIDEKIQ_CONCURRENCY
              value: "2"
            - name: RAILS_MAX_THREADS
              value: "10"
      imagePullSecrets:
        - name: registry-sports
